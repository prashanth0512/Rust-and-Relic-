<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Rust & Relic</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="../images/logo-new.svg">
</head>
<body>
    <div class="signup-container1">
        <div class="theme-toggle-wrapper">
            <button class="rtl-toggle" id="rtl-toggle" aria-label="Toggle RTL layout">RTL</button>
            <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">
                <i class="fas fa-moon moon-icon"></i>
                <i class="fas fa-sun sun-icon"></i>
            </button>
        </div>
        <div class="auth-wrapper">
            <div class="left-side">
                <div class="brand-overlay">
                    <h1 class="brand-text">RUST & RELIC</h1>
                    <p class="brand-tagline">Since 1974</p>
                </div>
            </div>
            <div class="right-side">
                <a href="../index.html" class="logo auth-logo" style="margin-bottom: 1rem; display: flex; justify-content: center;">
                    <img src="../images/logo-new.svg" alt="Rust & Relic" class="nav-logo-img" style="height: 35px; width: auto;">
                </a>
                
                <h1 class="hero-title">Welcome Back</h1>
                <p class="subtitle">Enter your details to manage your collection and alerts.</p>
                
                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <input type="email" placeholder="Email Address" required class="signup-form-input">
                        <div class="error-message">Invalid email address</div>
                    </div>
                    
                    <div class="form-group">
                        <input type="password" placeholder="Password" required class="signup-form-input">
                        <div class="error-message">Incorrect password</div>
                    </div>
                    
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox"> Remember Me
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary full-width-btn">Sign In</button>
                </form>

                <div class="social-login">
                    <p class="divider"><span>Or continue with</span></p>
                    <div class="social-icons">
                        <a href="https://accounts.google.com/" class="social-btn google" aria-label="Sign in with Google">
                            <i class="fab fa-google"></i>
                        </a>
                        <a href="https://appleid.apple.com/" class="social-btn apple" aria-label="Sign in with Apple">
                            <i class="fab fa-apple"></i>
                        </a>
                    </div>
                </div>
                
                <div class="auth-footer">
                    <p>New user? <a href="signup.html">Create account</a></p>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/main.js"></script>
</body>
</html>
