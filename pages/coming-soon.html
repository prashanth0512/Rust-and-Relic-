<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Rust & Relic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/utility-pages.css">
     <link rel="icon" type="image/svg+xml" href="../images/logo-new.svg">
</head>
</head>
<body>
    <div class="utility-container">
        
        <div class="theme-toggle-wrapper">
            <button class="icon-btn theme-toggle" aria-label="Toggle Dark Mode" id="theme-toggle">
                <svg class="moon-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
                </svg>
                <svg class="sun-icon" style="display:none;" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="5"></circle>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                </svg>
            </button>
        </div>

        <section class="coming-soon-section">
            <h1 class="section-title animate-in delay-1">New Collection Arriving</h1>
            <p class="section-desc animate-in delay-2">Our craftsmen are restoring the next generation of vintage treasures. Join us for the unveiling.</p>
            
            <div class="countdown animate-in delay-3">
                <div class="count-item days">
                    <span class="count-val">00</span>
                    <span class="count-label">Days</span>
                </div>
                <div class="count-item hours">
                    <span class="count-val">00</span>
                    <span class="count-label">Hours</span>
                </div>
                <div class="count-item minutes">
                    <span class="count-val">00</span>
                    <span class="count-label">Mins</span>
                </div>
                <div class="count-item seconds">
                    <span class="count-val">00</span>
                    <span class="count-label">Secs</span>
                </div>
            </div>

            <a href="../index.html" class="btn btn-primary animate-in delay-1" style="margin-top: 1rem;">Return Home</a>
        </section>
    </div>

    <script src="../js/utility-pages.js"></script>
</body>
</html>
