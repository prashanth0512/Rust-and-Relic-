<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Rust & Relic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/utility-pages.css"> 
    <link rel="icon" type="image/svg+xml" href="../images/logo-new.svg">
</head>

</head>
<body class="no-scroll">
    <div class="utility-container">
        
        <div class="theme-toggle-wrapper">
            <button class="icon-btn theme-toggle" aria-label="Toggle Dark Mode" id="theme-toggle">
                <svg class="moon-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
                </svg>
                <svg class="sun-icon" style="display:none;" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="5"></circle>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                </svg>
            </button>
        </div>

        <div class="bg-animation">
            <div class="sphere sphere-1"></div>
            <div class="sphere sphere-2"></div>
        </div>

        <section class="error-section">
            <h1 class="error-code animate-in">404</h1>
            <h2 class="section-title animate-in delay-1">LOST IN THE THREADS</h2>
            <p class="section-desc animate-in delay-2">The page you are looking for has been moved, removed, or perhaps never existed. Let us guide you back to where the craftsmanship begins.</p>
            <a href="../index.html" class="btn btn-primary animate-in delay-1">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                BACK TO HOME
            </a>

        </section>
    </div>

    <script src="../js/utility-pages.js"></script>
</body>
</html>
